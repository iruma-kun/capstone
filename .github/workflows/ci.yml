# =============================================================================
# LexFlow - Legal Practice Management System
# GitHub Actions CI/CD Pipeline
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black mypy

      - name: Run Ruff (linting)
        run: ruff check app/ migrations/

      - name: Run Black (formatting check)
        run: black --check app/ migrations/

      - name: Run MyPy (type checking)
        run: mypy app/ --ignore-missing-imports

  # ---------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        if: always()

  # ---------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit (static analysis)
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Run Safety (dependency vulnerabilities)
        run: safety check -r requirements.txt --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ---------------------------------------------------------
  # Build Docker Images
  # ---------------------------------------------------------
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LexFlow app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: lexflow-app:latest
          load: true

      - name: Test docker-compose
        run: |
          docker-compose up -d --build
          sleep 20
          curl -f http://localhost:8000/health || exit 1
          docker-compose down -v

  # ---------------------------------------------------------
  # Deploy (Placeholder)
  # ---------------------------------------------------------
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to AWS ECS / Kubernetes
        run: echo "Deploy to staging environment - add your deployment commands here"
