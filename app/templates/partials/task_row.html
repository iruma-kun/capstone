<div class="task-row {{ 'done' if task.completed }}" id="task-{{ task.id }}"><form hx-post="/app/tasks/{{ task.id }}/toggle" hx-target="#task-{{ task.id }}" hx-swap="outerHTML"><button class="task-check" aria-label="{{ 'Reopen' if task.completed else 'Complete' }} task">{{ '✓' if task.completed else '' }}</button></form><div><strong>{{ task.title }}</strong><small>{% if user.role == 'Legal agent' %}{{ task.matter.reference }}{% else %}<a href="/app/matters/{{ task.matter.id }}">{{ task.matter.reference }}</a> · {{ task.assignee }}{% endif %}</small>{% if task.document %}<a class="task-file" href="/app/documents/{{ task.document.id }}/download"><span>↓</span>{{ task.document.name }}</a>{% endif %}</div><span class="task-due {{ 'overdue' if task.due_date and task.due_date < today and not task.completed }}">{{ task.due_date.strftime('%b %d') if task.due_date else 'No date' }}</span></div>
