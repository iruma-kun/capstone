# =============================================================================
# Cloud-Native Automated Compliance & Audit System (CACA)
# Docker Compose - Fully Containerized, Zero Host Dependencies
# =============================================================================
# Usage: docker-compose up --build
# Access: http://localhost:3000 (Frontend) | http://localhost:8000/docs (API)
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------
  # PostgreSQL Database (Production-grade)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: caca-postgres
    environment:
      POSTGRES_DB: compliance_audit
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caca-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: caca-backend
    environment:
      DATABASE_URL: postgresql://compliance:compliance123@postgres:5432/compliance_audit
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ./backend:/app/backend:ro
      - ./samples:/app/samples:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - caca-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caca-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - caca-network
    restart: unless-stopped

  # ---------------------------------------------------------
  # Seed Service (Runs once on startup)
  # ---------------------------------------------------------
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: caca-seeder
    environment:
      DATABASE_URL: postgresql://compliance:compliance123@postgres:5432/compliance_audit
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      sh -c "sleep 5 && python -c \"
import sys; sys.path.insert(0, 'backend')
from backend.main import seed_sample_documents
from backend.database import SessionLocal
db = SessionLocal()
try:
    result = seed_sample_documents(db)
    print('Seeded:', result)
finally:
    db.close()
\""
    networks:
      - caca-network
    restart: "no"

volumes:
  postgres_data:

networks:
  caca-network:
    driver: bridge
